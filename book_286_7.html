<!DOCTYPE html>
<html lang="ko>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>곰인형 편집</title>
    <style>
        #container {
            width: 350px;
            margin: 30px auto;
        }
        img {
            border: 1px solid #ccc;         /* 테두리선 넣기 */
            border-radius: 50%;               /* 이미지를 둥글게 */
            box-shadow: 5px 5px 30px 2px #000; /* 그림자 */
        }
    </style>
</head>
<body>
    <div id="container">
        <img src="images/bear.jpg" alt="곰인형사진">
    </div>
</body>
</html>
