<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프런트엔드 개발자 지원서</title>
    <style>
        #container {
            width: 550px;
            height: auto;

        }
        li {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id='container'>
        <form>
            <h1>프런트엔드 개발자 지원서</h1>
            <p>HTML, CSS, 자바스크립트의 기술을 이해하고 실무 경험이 있는 분을 찾습니다.</p>
            <hr>
            <p>개인 정보</p>
            <ul>
                <li>
                    <label for="r-name">이름</label>
                    <input type="text" id="r-name">
                </li>
                <li>
                    <label for="r-phone">연락처</label>
                    <input type="tel" id="r-phone">
                </li>

            </ul>
            <p>지원 분야</p>
            <ul>
                <li>웹 퍼블리싱</li>
                <li>웹 어플리케이션 개발</li>
                <li>개발 환경 개선</li>
            </ul>
            <p>지원 동기</p>
            <li>
                <textarea name="" id=""></textarea>
            </li>
        </form>
    </div>
</body>
</html>
