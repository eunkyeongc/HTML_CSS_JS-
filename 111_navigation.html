<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Style : Navigation</title>
    <style>
        .container {
            width: 960px;   
            margin: 0 auto;
        }
        .navi {
            width: 960px;
            height: 60px;
            padding-bottom: 10px;            
            border-bottom: 2px solid #ccc;
        }
        .navi ul {
            list-style: none;
            padding-bottom: 5px;
            padding-top: 10px;
        }
        .navi ul li {
            float: left;
            width: 150px;
            padding: 10px;
        }

        .navi a:link, .navi a:visited {
            display: block;
            font-size: 14px;
            color: #000;
            padding: 10px;
            text-decoration: none; /* 하이퍼링크 밑줄 없애기 */
            text-align: center;    /* 텍스트 가운데 정렬 */
        }
        .navi a:hover, .navi a:focus {
            background-color: #222;/* 하이퍼링크 위에 마우스 올렸을 때 */
            color: #fff;
        }
        .navi a:active {
            background-color: red;  /* 하이퍼링크 위에 마우스 누르고 있을 때*/
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navi">
            <ul>
                <li><a href="#">이용안내</a></li>
                <li><a href="#">객실소개</a></li>
                <li><a href="#">예약방법 및 요금</a></li>
                <li><a href="#">예약하기</a></li>
            </ul>
        </nav>
    </div> 
</body>
</html>
