<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        .container {
            width: 700px;
            display: flex;
            justify-content: flex-end;
            background-color: rgb(201, 218, 212);
            border: 1px solid black;
            margin-bottom: 30px;
        }

        .box{
            padding: 5px 20px;
            margin: 5px;
            width: 150px;
        }

        .box:nth-child(odd){
            background-color: rgb(255, 166, 0);

        }
        .box:nth-child(even){
            background-color: rgb(0, 255, 34);
            
        }
        
        p { 
            text-align: coenter;
            font-weight: bold;
        }
        #box3 {
            margin-left: auto;  /* 1번 박스의 오른쪽 마진을 auto */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1"><p>1</p></div>
        <div class="box" id="box2"><p>2</p></div>
        <div class="box" id="box3"><p>margin-left: auto</p></div>
    </div>
</body>
</html>
