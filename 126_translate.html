<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>translate 함수로 웹 요소 이동하기</title>
    <style>
        .container { 
            width: 800px;
            height: 200px;
            margin: 20px auto;            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .origin {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            margin: 40px;
            /* float:left; */ 
        }

        .origin > div {
            width: 100px;
            height: 100px;
            background-color: orange;
            transition: 1s;
        }

        #movex:hover {      /*movex에 마우스를 올리면... hover*/
            transform: translateX(50px);
        }

        #movey:hover {      /*movey에 마우스를 올리면... hover*/
            transform: translatey(20px);
        }

        #move:hover {      /*move에 마우스를 올리면... hover*/
            transform: translate(10px, 20px);
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="origin">
            <div id="movex"></div>
        </div>

        <div class="origin">
            <div id="movey"></div>
        </div>

        <div class="origin">
            <div id="move"></div>
        </div>
    </div>
</body>
</html>
