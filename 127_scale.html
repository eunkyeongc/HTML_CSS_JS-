<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scale 함수fmf 사용해 확대.축소하기</title>
    <style>
        .container { 
            width: 800px;
            height: 200px;
            margin: 20px auto;            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .origin {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            margin: 40px;
            /* float:left; */ 
        }

        .origin > div {
            width: 100px;
            height: 100px;
            background-color: orange;
            transition: 1s;  /* 움직이는 속도 */
        }

        #scalex:hover {      /*scalex에 마우스를 올리면... hover*/
            transform: scaleX(2);
        }

        #scaley:hover {      /*movey에 마우스를 올리면... hover*/
            transform: scaleY(1.5);
        }

        #scale:hover {      /*movexy에 마우스를 올리면... hover*/
            transform: scale(0.7);
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="origin">
            <div id="scalex"></div>
        </div>

        <div class="origin">
            <div id="scaley"></div>
        </div>

        <div class="origin">
            <div id="scale"></div>
        </div>
    </div>
</body>
</html>
