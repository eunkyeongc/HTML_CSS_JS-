<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rotate 함수를 활용해 3차원에서 회전하기</title>
    <style>
        
        .container {
            width: 800px;
            margin: 20px auto;
         
        }

        .origin {
            width: 100px;
            height: 100px;
            margin:  40px;
            float: left;
            border: 1px solid black;
            perspective: 200px;  /*원근감*/
        }

        .origin > div {
            width: 100px;
            height: 100px;
            background-color: orange;
            transition:all 3s;
        }

        #rotatex:hover {
            transform: rotatex(55deg);
        }

         #rotatey:hover {
            transform: rotatey(55deg);
        }

         #rotatez:hover {
            transform: rotatez(55deg);
        }
        
         #rotatexyz:hover {
            transform: rotate3d(2.5, 1.2, -1.5, 55deg);
        }

    </style>
</head>
<body>
    <div class="container">

        <div class="origin">
            <div id="rotatex"></div>
        </div>

        <div class="origin">
            <div id="rotatey"></div>
        </div>

        <div class="origin">
            <div id="rotatez"></div>
        </div>

        <div class="origin">
            <div id="rotatexyz"></div>
        </div>        

    </div>
</body>
</html>
