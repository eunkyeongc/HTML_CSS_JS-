<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 1000px;
            margin: 10px auto;
            padding: 10px;
            display: grid;
            grid-template-columns: auto;
            grid-template-rows: repeat(3, 250px);
            gap: 0.5rem;
            }

            .item {
                border-radius: 5px;
                font-size: 2rem;                
            }
            
            .item-1 {
                background-color: #e91363;
                grid-column: 1/2;
                grid-row: 1/3;
            }
            .item-2 {
                background-color: #ebc20c;
                grid-column: 2/4;
                grid-row: 1/2;
            }
            .item-3 {
                background-color: #0c92eb;
                grid-column: 2/3;
                grid-row: 2/3;
            }
            .item-4 {
                background-color: #350ceb;
                grid-column: 3/4;
                grid-row: 2/3;
            }
            .item-5 {
                background-color: #eb0ceb;
                grid-column: 1/4;
                grid-row: 3/4;
            }

            @media (max-width:768px) {
                .container {
                    width: 720px;
                    margin: 10px auto;
                    display: block;                    
                }
                .item {
                    height: 200px;
                    margin-bottom: 10px;
                }
            }
            @media (max-width:320px) {
                .container {
                    width: 300px;
                    margin: 10px auto;
                    display: block;                    
                }
                .item {
                    height: 200px;
                    margin-bottom: 10px;
                }
            }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">box1</div>
        <div class="item item-2">box2</div>
        <div class="item item-3">box3</div>
        <div class="item item-4">box4</div>
        <div class="item item-5">box5</div>                
    </div>
</body>
</html>
