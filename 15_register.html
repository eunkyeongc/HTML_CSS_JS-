<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
</head>
<body>
    <h1><b>회원 가입을 환영합니다!</b></h1>
    <form action="">
        <fieldset>
            <legend>사용자 정보</legend> 
            <ul>
                <li>
                    <label for="uid">아이디</label>
                    <input type="text" id="uid" autofocus placeholder="4자~10자 사이 공백없이" required>
                     <!-- autofocus:커서 placeholder:희리게, 입력시 사라짐.  required: 무조건 입력 -->
                </li>
                <li>
                    <label for="umail">이메일</label>
                    <input type="email" id="umail" required>
                </li>
                <li>
                    <label for="pwd1">비밀번호</label>
                    <input type="password" id="pwd1" placeholder="문자와 숫자, 특수 기호 포함" required>
                </li>
                <li>
                    <label for="pwd2">비밀번호 확인</label>
                    <input type="password" id="pwd2" required>
                </li>
                <li>
                    <label for="path">가입 경로</label>
                    <select id="path">
                        <option value="blog">블로그</option>
                        <option value="search">검색</option>
                        <option value="sns">SNS</option>
                        <option value="etc">기타</option>
                    </select>
                </li>
                <li>
                    <label for="memo">메모</label>
                    <textarea id="memo" cols="40", rows="4" placeholder="남길 말씀이 있다면 여기에 남겨주세요!"></textarea>
                </li>
            </ul>
        </fieldset>
<BR></BR>
        <fieldset>
            <legend>이벤트와 새로운 소식</legend>
            <input type="radio" name="mailing" id="mailing_y" value="mailing_yes">
            <label for="mailing_y">메일 수신</label>
            <input type="radio" name="mailing" id="mailing_n" value="mailing_no" checked>
            <!-- checked :  라디오 버튼 기본 세팅 됨 -->
            <label for="mailing_y">메일 수신 안 함</label>
        </fieldset>
<BR></BR>
        <div>
            <input type="submit" value="가입하기" >
            <input type="reset" value="취소" >
        </div>
    
    </form>
</body>
</html>
