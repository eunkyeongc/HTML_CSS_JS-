<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box Layout</title>
    <style>
        .container {
            width: 800px;
            display: flex;  /*플렉스 미지정시 글자 크기에 맞추어 박스크기 조절 */
            border: 1px solid #222;
            background-color: #eee;
            gap: 30px;
        }

        box1 {
            background-color: #222;
        }

        .box {
            background-color: #222;
            flex-basis: 150px;  /* 플렉스 항목의 기본 크기 150px로 박스크기 조절  */
        }

        p {
            color: white;
            text-align: center;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"><p>가나다라마</p></div>
        <div class="box1"><p>가나다라마바사</p></div>
        <div class="box1"><p>ABCDE</p></div>
    </div>
    <div class="container">
        <div class="box"><p>가나다라마</p></div>
        <div class="box"><p>가나다라마바사</p></div>
        <div class="box"><p>ABCDE</p></div>
    </div>
</body>
</html>
