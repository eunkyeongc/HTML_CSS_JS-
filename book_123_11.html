<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수습 국원 지원 양식</title>
    <style>
        #container {
            width: 450px;
            border: 1px solid #CCC ;
            padding-bottom:20px;  /* 박스 안 아래 여백 */
            padding-left: 20px;
        }
        .resume {
            border: 1px double black;
        }
        table td {
            border: 1px solid, black;
            text-align: center;
            column-width: 100px;
            column-height: 40px;
            padding-top: 10px;
        }
        .input-col {
            column-width: 200px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>수습 국원 지원 양식</h1>
        <table class="resume">
            <tbody>
                <tr>
                    <td  rowspan="3">개인정보</td>
                    <td>이름</td>
                    <td class="input-col"></td>
                </tr>
                <tr>                   
                    <td>학과/학번</td>
                    <td  class="input-col"></td>
                </tr>
                <tr>                    
                    <td>연락처</td>
                    <td  class="input-col"></td>
                </tr>
                <tr>
                    <td>지원분야</td>
                    <td colspan="2"></td>                
                </tr>
            </tbody>
        </table>
        </h1>
    </div>
</body>
</html>
