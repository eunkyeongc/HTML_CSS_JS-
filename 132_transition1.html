<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트랜지션 속성을 한꺼번에 지정하기</title>
    <style>
        .box {
            margin: 50px auto;
            width: 100px;
            height: 100px;
            background-color: blue ;
            border: 1px solid #222;
            transition: 2s ease-in;
        }
        .box:hover {
            width: 200px;
            height: 200px;
            background-color: red;
            transform: rotate(270deg);
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
