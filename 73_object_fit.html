<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
            body {
                display: flex; /* 가로 방향으로 나열됨, 한 줄에 배치됨, 컨테이너 크기에 맞게 정렬 가능 */
                flex-wrap: wrap; /* 공간이 부족하면 자동으로 다음줄로 이동 */
                gap: 5px; /* 이미지 사이의 여유 공간 */
            }

            .container {
                width: 200px;
                height: 400px;
                border: 1px solid black;
            }

            img {
                width: 100%; /*container size에 맞혀서 100% */
                height: 100%;
            }

            .fill {
                object-fit: fill; /* 원래 비율을 무시하고 전체 요소를 가득 채움  */
            }
            .contain {
                object-fit: contain; /* 비율을 유지하면서 요소의 전체 영역을 채울 수 있을 만큼 확대, 전체를 채우지 못 할 수 있음. */
            }
            .cover {
                object-fit: cover; /* 비율을 유지하면서 요소의 전체 영역을 채울 수 있을 만큼 확대, 일부가 잘릴 수 있음.*/
            }
            .none {
                object-fit: none; /* 컨텥츠의 원래 크기를 유지 */
            }
            .scale-down {
                object-fit: scale-down; /* none와 contain 중 콘텐츠 크기가 더 작아지는 값을 선택 */
            }
        </style>
</head>
<body>
    <div class="container">
        <img src="images/cat.png" alt="고양이" class="fill">
        <h3>objext-fit : fill</h3>
    </div>
    <div class="container">
        <img src="images/cat.png" alt="고양이" class="contain">
        <h3>objext-fit : contain</h3>
    </div>
    <div class="container">
        <img src="images/cat.png" alt="고양이" class="cover">
        <h3>objext-fit : cover</h3>
    </div>
    <div class="container">
        <img src="images/cat.png" alt="고양이" class="none">
        <h3>objext-fit : none</h3>
    </div>
    <div class="container">
        <img src="images/cat.png" alt="고양이" class="scale-down">
        <h3>objext-fit : scale-down</h3>
    </div>
</body>
</html>
