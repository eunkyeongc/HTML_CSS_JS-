<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model_margin</title>
    <style>
        * {
            box-sizing: border-box;
        }
        div {
            width: 200px;            
            height: 100px;
            margin: 30px;
        }
        #margin1 {         
            background-color: yellow;
        }
        #margin2 {            
            background-color: aquamarine;
        }
        #margin3 {            
            background-color: blueviolet;
        }
    </style>

</head>
<body>
    <div id="margin1"></div>
    <div id="margin2"></div>
    <div id="margin3"></div>
</body>
</html>
