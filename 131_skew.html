<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rotate 함수를 활용해 3차원에서 회전하기</title>
    <style>
        
        .container {
            width: 800px;
            margin: 20px auto;
            
        }

        .origin {
            width: 100px;
            height: 100px;
            margin:  40px;
            float: left;
            border: 1px solid black;
            perspective: 200px;  /*원근감*/
        }

        .origin > div {
            width: 100px;
            height: 100px;
            background-color: orange;
            transition:all 3s;
        }

        #skewx:hover {
            transform: skewX(30deg);
        }

        #skewy:hover {
            transform: skewY(15deg);
        }

        #skewxy:hover {
            transform: skew(-20deg, -15deg);
        }
        
    </style>
</head>
<body>
    <div class="container">

        <div class="origin">
            <div id="skewx"></div>
        </div>

        <div class="origin">
            <div id="skewy"></div>
        </div>

        <div class="origin">
            <div id="skewxy"></div>
        </div>
    </div>
</body>
</html>
