<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        body { 
            display: flex;  /* 자식 요소들을 유연하게 배치할 수 있게 해줌 */
            justify-content: center;    /* 좌우 중앙 정렬 */
            align-items: center;    /* 상하 중앙 정렬 */
            height: 100vh;  /* 브라우저 화면 높이의 100% */
            background-color: black; /* 배경색 */
            margin: 0;
        }    
        .gallery {      
            width: 600px;
            height: 500px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
        }
        .grid-item {
            background-color: yellow; /* 아이템 배경색 */
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
        }
        .item1 {
            grid-column: 1/3;
            grid-row: 1/3;            
        }
        .item2 {
            grid-column: 3/5;
            grid-row-start: 1;
        }
        .item3{
            grid-column-start: 3;
            grid-row: 2/4
        }
        .item4{
            grid-column-start: 4;
            grid-row: 2/4;
        }
        .item5 {
            grid-column: 1/3;
            grid-row-start: 3;
        }
    </style>
</head>
<body>
  <div class="gallery">
    <div class="grid-item item1">1</div>
    <div class="grid-item item2">2</div>
    <div class="grid-item item3">3</div>
    <div class="grid-item item4">4</div>
    <div class="grid-item item5">5</div>
  </div>
</body>
</html>
