<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제_에니메이션</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;             
        }

        .spinner {
            width: 200px;
            height: 200px;
            background: url(ball.png) no-repeat;
            background-size: 100%;            
            animation:ball 2s  infinite linear;        
        }

        @keyframes ball {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }      
        
    </style>
</head>
<body>   
    <div id="container">
        <div class="spinner"></div>
    </div> 
</body>
</html>
