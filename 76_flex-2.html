<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box layout</title>
        <style>
            .container {
                justify-content: row;
                display: flex;
                background-color: #eee;
                border: 1px solid #222;
                margin-bottom: 30px;
            }
            .box {
                width: 120px;
                padding: 5px 20px;
                margin: 5px;
            
            }
            .box:nth-child(odd) {
                background-color: rgb(255, 187, 0);
            }

            .box:nth-child(even) {
                background-color: rgb(0, 255, 64);
            }
            p {
                text-align: center;
                font-weight: bold;
            }
            #opt1 {
                flex-wrap: nowrap;
            }
            #opt2 {
               flex-wrap: wrap;
            }
            #opt3 {
                flex-wrap: wrap-reverse;
            }
           
        </style>
</head>
<body>
    <div class="container" id="opt1">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">nowrap</div>
    </div>
    
    <div class="container" id="opt2">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">flex-wrap: wrap</div>
    </div>
    
    <div class="container" id="opt3">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box"> wrap-reverse</div>
    </div>
</body>
</html>
